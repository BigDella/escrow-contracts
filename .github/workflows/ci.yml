name: ci

# Pushes run only on the long-lived branches; every other branch is covered by its pull request.
# This stops a PR branch from running the whole pipeline twice (once for the push, once for the PR).
on:
  push:
    branches: [fresh-build, main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR (or branch) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - uses: ./.github/actions/setup-stellar
      # the upgrade test embeds the built wasm, so build before fmt/clippy/test
      - run: ./scripts/build.sh
      - run: bash scripts/reproducible-build.sh
      - run: python3 scripts/check_contract_docs.py
      - run: bash scripts/tests/deploy-mainnet.test.sh
      - run: cargo fmt --check
      # The stricter lint set lives in [workspace.lints] in Cargo.toml; -D warnings makes every hit fail CI.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-coverage-${{ runner.os }}-llvm-cov-0.9.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-coverage-${{ runner.os }}-llvm-cov-0.9.1-
      - name: install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install --locked cargo-llvm-cov --version 0.9.1
      - uses: ./.github/actions/setup-stellar
      # the upgrade test embeds the built wasm
      - run: ./scripts/build.sh
      - name: run tests with coverage
        # The test modules themselves are excluded so the numbers describe the contract code only.
        env:
          IGNORE: src/test/
        run: |
          cargo llvm-cov --locked --package bounty_escrow --ignore-filename-regex "$IGNORE" --lcov --output-path lcov.info
          cargo llvm-cov report --package bounty_escrow --ignore-filename-regex "$IGNORE" --html --output-dir coverage-html
          cargo llvm-cov report --package bounty_escrow --ignore-filename-regex "$IGNORE" --summary-only | tee coverage-summary.txt
          {
            echo '### Coverage (bounty_escrow)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
            coverage-html/
          if-no-files-found: error

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # shellcheck ships preinstalled on the ubuntu runners.
      - run: shellcheck --version
      - run: shellcheck scripts/*.sh scripts/tests/*.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Cache the cargo-audit binary only. The advisory database is fetched fresh on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.23.0-${{ hashFiles('rust-toolchain.toml') }}
      - name: install cargo-audit
        run: command -v cargo-audit || cargo install --locked cargo-audit --version 0.23.0
      - run: cargo audit
